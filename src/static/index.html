<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>集中タイマー</title>
  <style>
    body {
      font-family: sans-serif;
      color: #fff;
      text-align: center;
      background-color: #1a2530;
      background-size: cover;
      background-position: center;
      transition: background-image 0.5s ease;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 12px;
      display: inline-block;
    }
    .settings {
      margin-bottom: 20px;
      text-align: left;
      font-size: 14px;
    }
    .settings div {
      margin-top: 8px;
    }
    .timer-display {
      font-size: 48px;
      font-weight: bold;
      margin: 20px 0;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>集中タイマー</h2>

  <!-- 画像設定エリア -->
  <div class="settings">
    <div>
      <label>勉強モード背景: </label>
      <input type="file" id="studyBgInput" accept="image/*">
    </div>
    <div>
      <label>休憩モード背景: </label>
      <input type="file" id="breakBgInput" accept="image/*">
    </div>
  </div>

  <div id="modeLabel">勉強</div>
  <div class="timer-display" id="timeDisplay">15</div>
  
  <button id="startBtn">スタート</button>
</div>

<script>
  // 設定時間（秒）
  const STUDY_TIME = 15;
  const BREAK_TIME = 10;

  let currentMode = 'study'; // 'study' または 'break'
  let timeLeft = STUDY_TIME;
  let timerId = null;

  // 背景画像URL保持用
  let studyBgUrl = '';
  let breakBgUrl = '';

  const timeDisplay = document.getElementById('timeDisplay');
  const modeLabel = document.getElementById('modeLabel');
  const startBtn = document.getElementById('startBtn');

  // 画像アップロードのイベントリスナー
  document.getElementById('studyBgInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      studyBgUrl = URL.createObjectURL(file);
      if (currentMode === 'study') updateBackground();
    }
  });

  document.getElementById('breakBgInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      breakBgUrl = URL.createObjectURL(file);
      if (currentMode === 'break') updateBackground();
    }
  });

  // 背景画像の更新処理
  function updateBackground() {
    const bgUrl = currentMode === 'study' ? studyBgUrl : breakBgUrl;
    if (bgUrl) {
      document.body.style.backgroundImage = `url('${bgUrl}')`;
    } else {
      document.body.style.backgroundImage = 'none';
    }
  }

  // タイマー表示更新
  function updateDisplay() {
    timeDisplay.textContent = timeLeft;
    modeLabel.textContent = currentMode === 'study' ? '勉強' : '休憩';
    updateBackground();
  }

  // モード切り替え
  function switchMode() {
    if (currentMode === 'study') {
      currentMode = 'break';
      timeLeft = BREAK_TIME;
    } else {
      currentMode = 'study';
      timeLeft = STUDY_TIME;
    }
    updateDisplay();
  }

  // タイマー処理
  function tick() {
    if (timeLeft > 0) {
      timeLeft--;
      timeDisplay.textContent = timeLeft;
    } else {
      switchMode();
    }
  }

  // スタート / パウズ
  startBtn.addEventListener('click', () => {
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = 'スタート';
    } else {
      timerId = setInterval(tick, 1000);
      startBtn.textContent = '一時停止';
    }
  });

  // 初期表示
  updateDisplay();
</script>

</body>
</html>
